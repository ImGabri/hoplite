name: Build Slot Cycler (Minecraft 1.21.11)

on:
  push:
    branches:
      - 'claude/sleepy-curie-pmdo51'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build
      - name: Upload playable JAR
        uses: actions/upload-artifact@v4
        with:
          name: slotcycler-minecraft-1.21.11
          path: build/libs/slotcycler-1.0.0.jar
          if-no-files-found: error
