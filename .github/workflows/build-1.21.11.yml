name: Build and Release Slot Cycler (Minecraft 1.21.11)

on:
  push:
    branches:
      - 'claude/sleepy-curie-pmdo51'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build
      - name: Verify compiled JAR
        run: |
          test -s build/libs/slotcycler-1.0.0.jar
          unzip -p build/libs/slotcycler-1.0.0.jar fabric.mod.json | grep -q 'slotcycler'
          sha256sum build/libs/slotcycler-1.0.0.jar
      - name: Upload playable JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: slotcycler-minecraft-1.21.11
          path: build/libs/slotcycler-1.0.0.jar
          if-no-files-found: error
      - name: Publish GitHub Release with JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="slotcycler-v1.0.0-mc1.21.11"
          JAR="build/libs/slotcycler-1.0.0.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "Slot Cycler v1.0.0 (Minecraft 1.21.11)" \
              --notes "Fabric client mod for Minecraft 1.21.11. Requires Fabric Loader, Fabric API, and Fabric Language Kotlin. Download the slotcycler-1.0.0.jar file and put it into your mods folder."
          fi
